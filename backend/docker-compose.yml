services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development

    ports:
      - '8000:8000'

    volumes:
      - .:/app

    env_file:
      - .env

    depends_on:
      - postgres

    networks:
      - demo-network

  postgres:
    image: postgres:17

    env_file:
      - .env

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - demo-network

  pgadmin:
    image: dpage/pgadmin4

    env_file:
      - .env

    ports:
      - '5050:80'

    depends_on:
      - postgres

    networks:
      - demo-network

volumes:
  postgres_data:

networks:
  demo-network:
    external: true
